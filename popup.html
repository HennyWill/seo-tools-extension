<!DOCTYPE html>
<html lang="en">
  <head>
    <title>SEO Tools</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1 class="title">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          SEO Tools
        </h1>
        <button id="themeToggle" aria-label="Toggle color theme" class="theme-toggle" title="Toggle theme (Ctrl+Shift+T)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>

      <!-- Summary Panel (auto-loads) -->
      <div id="summaryPanel" class="summary-panel">
        <div class="summary-header">
          <span class="summary-title">Page overview</span>
          <div class="summary-actions">
            <button id="summaryCopy" aria-label="Copy page overview" class="summary-action-btn" title="Copy summary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
            <button id="summaryRefresh" aria-label="Refresh page overview" class="summary-action-btn" title="Refresh">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M1 4v6h6"></path>
                <path d="M23 20v-6h-6"></path>
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
              </svg>
            </button>
          </div>
        </div>
        <div id="summaryContent" class="summary-content">
          <div class="summary-loading">
            <span class="spinner"></span>
            <span>Analyzing page...</span>
          </div>
        </div>
      </div>

      <section class="tool-section quick-access" aria-label="Quick access">
        <div class="buttons quick-actions">
<button id="consoleButton" title="Open Google Search Console" aria-label="Open Google Search Console">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
            GSC
          </button>
<button id="searchButton" title="Find this page in Google Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            Google Search
          </button>
<button id="richResultsButton" title="Open Google Rich Results Test">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3h7v7M21 3l-9 9M10 3H4a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-6"/></svg>
            Rich Results
          </button>
        </div>
        <div class="buttons ahrefs-actions">
<button id="ahrefsButton">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
            Ahrefs Site Explorer
          </button>
<button id="ahrefsBacklinksButton">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            Ahrefs Backlinks
          </button>
        </div>
      </section>
      <section class="tool-section">
        <h2 class="section-label">Inspect page</h2>
        <div class="buttons">
<button id="checkIndexabilityButton" title="Keyboard: Ctrl+Shift+I">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
            Check Indexability
          </button>
<button id="metaTagsButton">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 7V4h16v3"></path>
              <path d="M9 20h6"></path>
              <path d="M12 4v16"></path>
            </svg>
            Meta Tags Overview
          </button>
<button id="checkSchemaButton">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
            View JSON-LD
          </button>
<button id="analyzeLinksButton">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4zM4 10h16M10 5v14"/></svg>
            Analyze Links
          </button>
<button id="brokenLinkCheckerButton">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              <line x1="4" y1="4" x2="20" y2="20" stroke-width="2"></line>
            </svg>
            Check Broken Links
          </button>
        </div>
      </section>
      <section class="tool-section">
        <h2 class="section-label">Extract & highlight</h2>
        <div class="buttons">
<button id="copyHeadingsButton" title="Keyboard: Ctrl+Shift+H">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 7h16M4 12h16M4 17h10"></path>
            </svg>
            Copy All Headings
          </button>
<button id="copyLinksButton">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            Copy All Links
          </button>
<button id="highlightLinksButton" title="Keyboard: Ctrl+Shift+L">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
              <line x1="11" y1="8" x2="11" y2="14"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
            Highlight All Links
          </button>
        </div>
      </section>
      <section class="tool-section">
        <h2 class="section-label">More</h2>
        <div class="buttons">
<button id="archiveButton">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            Archive.org
          </button>
        </div>
        <div class="gsc-settings"><label for="gscResource">Open Search Console for</label><select id="gscResource" aria-label="Search Console resource"><option value="">Domain (default)</option></select></div>
      </section>
      <!-- Report Container (for broken links) -->
      <div id="reportContainer"></div>

      <!-- Footer -->
      <div class="footer">
        <div class="version-info">Version 1.4.1</div>
        <div class="powered-by">by HennyWill</div>
      </div>

      <!-- Donate Section -->
      <div class="donate">

        <a href="https://www.buymeacoffee.com/hennywill" target="_blank">Support development ↗</a>
      </div>
    </div>
  </body>
</html>
